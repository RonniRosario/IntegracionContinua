name: Alerta DevOps ITLA

on:
  push:
    branches:
      - main

jobs:
  notificacion:
    runs-on: ubuntu-latest

    steps:
      - name: Enviar notificación
        run: |
          curl \
            -H "Content-Type: text/plain" \
            -d "Se realizó un push al repositorio en la rama main" \
            https://ntfy.sh/devops-itla